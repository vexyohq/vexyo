name: Release

# Tag-driven: push a tag like `v0.1.0` to publish @vexyo/core|cli|reporters at that version.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # A red suite can never ship: type-check + full test run before anything is built or published.
      - run: pnpm build
      - run: pnpm test

      # The tag drives the version (package.json stays 0.0.0 in git). All workspace
      # packages get $VERSION so cli's `workspace:*` deps resolve to it on publish.
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing vexyo $VERSION"
          pnpm -r exec -- npm pkg set "version=$VERSION"

      - run: pnpm build:dist
      - run: pnpm publint

      - name: Publish to npm
        run: pnpm publish -r --access public --provenance --no-git-checks

